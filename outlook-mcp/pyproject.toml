[project]
name = "outlook-mcp"
version = "0.1.0"
description = "MCP server for read-only Outlook/Exchange access via EWS"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "exchangelib>=5.4.0",
    "tzdata>=2024.1",
]

[project.scripts]
ews-mcp-server = "outlook_mcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/outlook_mcp"]
