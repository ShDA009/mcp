[project]
name = "zephyr-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.12,<2",
    "httpx>=0.27",
]

[project.scripts]
zephyr-mcp = "zephyr_mcp.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zephyr_mcp"]
